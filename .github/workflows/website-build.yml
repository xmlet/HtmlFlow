name: Website build

on:
  push:
  pull_request:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn typecheck

      - name: Format check
        run: yarn format:check

      - name: Build site
        run: yarn build

      - name: Verify agent-readiness artifacts
        run: |
          test -f build/llms.txt
          test -f build/llms-full.txt
          test -f build/robots.txt
          test -f build/docs/introduction/index.md
          test -f build/docs/core-concepts/index.md
          ! grep -rl "<TabItem" build/docs --include="*.md"

      - name: Verify deploy artifacts
        run: |
          test -f build/CNAME
          test -f build/.nojekyll

      # Packages build/ as the tarball actions/deploy-pages consumes.
      # Unlike upload-artifact, this preserves hidden files such as .nojekyll.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/gh-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  # Publishes to GitHub Pages. Pages is configured with build_type=workflow, so
  # this is what actually updates htmlflow.org; the gh-pages branch is the site
  # source, not the served output.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
